[project]
name = "html2doc"
version = "0.1.2"
description = "Конвертер HTML/HTM в Markdown, PDF и DOCX с CLI, Qt6 GUI и Web UI"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "html2doc" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "python-docx>=1.1",
    "weasyprint>=62.0",
    "pillow>=10.3",
    "typer>=0.12",
    "rich>=13.7",
    "pyside6-essentials>=6.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
html2doc = "html2doc.launcher:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/html2doc"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-beautifulsoup4>=4.12",
    "pypdf>=4.2",
    "httpx>=0.27",
    "pyinstaller>=6.7",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "UP040"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
