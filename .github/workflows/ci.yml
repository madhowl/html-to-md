name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run pytest
      - run: uv run ruff check
      - run: uv run mypy src
      - run: uv run html2doc selftest

  build-appimage:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            desktop-file-utils patchelf file \
            libpango-1.0-0 libpangocairo-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b libfreetype6 libfontconfig1 libcairo2 libcairo-gobject2 \
            libexpat1 libfribidi0 libgraphite2-3 libpng16-16 libffi8 \
            libpcre2-8-0 libxml2 librsvg2-2 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libgl1 libegl1 \
            fonts-dejavu-core fonts-liberation
      - run: bash packaging/linux/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: true
          install: >-
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-pango
            mingw-w64-x86_64-cairo
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-librsvg
            mingw-w64-x86_64-libffi
            mingw-w64-x86_64-expat
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-graphite2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-brotli
            mingw-w64-x86_64-gcc-libs
            mingw-w64-x86_64-ttf-dejavu
      - run: pwsh packaging/windows/build_exe.ps1 -Mode both
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: dist/*-portable.zip
          if-no-files-found: error
